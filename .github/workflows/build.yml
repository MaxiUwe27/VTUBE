name: Build AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag (z. B. v0.1.0) – leer lassen für einen normalen Build'
        required: false
        default: ''

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build AppImage
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag }}
        uses: actions/upload-artifact@v4
        with:
          name: VTube-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 3       # AppImages are ~150 MB; old ones filled the storage quota
          compression-level: 0    # AppImage is already compressed

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: VTube Linux ${{ inputs.release_tag || github.ref_name }}
          files: release/*.AppImage
          body_path: .github/RELEASE_NOTES.md
